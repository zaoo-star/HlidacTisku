name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk HlidacTisku.apk
          TAG="v1.1.${{ github.run_number }}"
          printf 'Stáhni **HlidacTisku.apk** v telefonu a nainstaluj (přes starou verzi, nastavení zůstane).\n\n**Změny:** %s\n' "$(printf '%s' "$MSG" | head -1)" > notes.md
          gh release create "$TAG" HlidacTisku.apk \
            --target "$GITHUB_SHA" \
            --latest \
            --title "Hlídač tisku $TAG" \
            --notes-file notes.md
