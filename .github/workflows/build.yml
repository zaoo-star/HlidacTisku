name: Build APK

on:
  push:
    branches: [bambu-widget]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Publish APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk TiskP1S.apk
          gh release delete tisk-p1s -y --cleanup-tag || true
          gh release create tisk-p1s TiskP1S.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Tisk P1S – Android widget (build ${{ github.run_number }})" \
            --notes "Stáhni TiskP1S.apk na telefonu a nainstaluj."
